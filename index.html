<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vena AI — Next Generation Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Advanced Neural Background */
    .neural-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .particle-field {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: driftParticles 50s linear infinite;
    }
    @keyframes driftParticles {
      0% { transform: translate(0, 0); }
      100% { transform: translate(100px, 100px); }
    }
    .gradient-orb {
      position: absolute;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15), rgba(139,92,246,0.05), transparent);
      top: -20%;
      right: -20%;
      filter: blur(100px);
      animation: orbPulse 10s infinite alternate;
    }
    .gradient-orb-2 {
      position: absolute;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.1), rgba(139,92,246,0.04), transparent);
      bottom: -10%;
      left: -10%;
      filter: blur(90px);
      animation: orbPulse 14s infinite alternate-reverse;
    }
    @keyframes orbPulse {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0c16; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3b82f6, #8b5cf6); border-radius: 10px; }

    /* Layout */
    .app-container {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(2px);
    }

    /* Sidebar — Tesla-Grade Glass */
    .sidebar {
      width: 320px;
      background: rgba(3, 6, 14, 0.85);
      backdrop-filter: blur(28px);
      border-right: 1px solid rgba(59,130,246,0.35);
      display: flex;
      flex-direction: column;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .brand-area {
      padding: 32px 24px 20px;
      border-bottom: 1px solid rgba(59,130,246,0.25);
    }
    .logo {
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa, #c084fc, #2dd4bf, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: spectralFlow 5s infinite;
      letter-spacing: -1.5px;
    }
    @keyframes spectralFlow {
      0%, 100% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(10deg); }
    }
    .slogan {
      font-size: 10px;
      color: #5b6e8c;
      margin-top: 8px;
      letter-spacing: 1.5px;
    }

    .profile-container {
      background: linear-gradient(145deg, rgba(30, 41, 75, 0.4), rgba(15, 23, 42, 0.6));
      margin: 20px 16px;
      padding: 16px;
      border-radius: 28px;
      border: 1px solid rgba(96,165,250,0.4);
      backdrop-filter: blur(8px);
    }
    #profileName {
      font-weight: 800;
      font-size: 1rem;
      background: linear-gradient(90deg, #e0e7ff, #a5b4fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .profile-stats {
      font-size: 0.65rem;
      color: #7e8aad;
      margin-top: 8px;
      display: flex;
      gap: 12px;
    }

    .button-group {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }
    .neon-btn {
      background: rgba(20, 25, 45, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59,130,246,0.4);
      padding: 11px 14px;
      border-radius: 20px;
      color: #f1f5f9;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
    }
    .neon-btn:hover {
      background: linear-gradient(95deg, rgba(59,130,246,0.25), rgba(139,92,246,0.25));
      transform: translateX(6px);
      border-color: #60a5fa;
      box-shadow: 0 4px 18px rgba(59,130,246,0.3);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .history-item {
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
      background: rgba(15, 20, 35, 0.4);
      border-left: 2px solid transparent;
    }
    .history-item.active {
      background: linear-gradient(90deg, #1e2a4a, #0f1428);
      border-left-color: #3b82f6;
    }

    /* Main Chat Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 70% 40%, rgba(15,25,55,0.15), transparent);
    }
    .header {
      padding: 18px 32px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(59,130,246,0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: linear-gradient(115deg, #1e293b, #0f172a);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid #3b82f6;
      animation: borderGlow 2s infinite;
    }
    @keyframes borderGlow {
      0% { border-color: #3b82f6; box-shadow: 0 0 0px; }
      50% { border-color: #c084fc; box-shadow: 0 0 15px rgba(96,165,250,0.5); }
      100% { border-color: #3b82f6; }
    }

    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      scroll-behavior: smooth;
    }

    /* Message Bubbles */
    .message {
      margin: 24px 0;
      display: flex;
      flex-direction: column;
      animation: fadeSlideUp 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-avatar {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .user-message .msg-avatar { color: #60a5fa; text-align: right; }
    .ai-message .msg-avatar { color: #c084fc; }
    .bubble {
      padding: 14px 22px;
      border-radius: 28px;
      max-width: 82%;
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .user-message {
      align-items: flex-end;
    }
    .user-message .bubble {
      background: linear-gradient(115deg, #1e40af, #3b82f6);
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(59,130,246,0.3);
    }
    .ai-message .bubble {
      background: linear-gradient(135deg, #0f1525, #080c18);
      border: 1px solid rgba(139,92,246,0.5);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(4px);
    }
    pre {
      background: #010208;
      padding: 14px;
      border-radius: 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      border: 1px solid #2d3a5e;
    }
    code {
      font-family: 'JetBrains Mono', monospace;
      background: #00000066;
      padding: 2px 7px;
      border-radius: 8px;
    }
    .bubble img {
      max-width: 240px;
      border-radius: 20px;
      margin-top: 10px;
      border: 2px solid #3b82f6;
    }

    /* Input Area */
    .input-section {
      padding: 20px 28px 32px;
      background: linear-gradient(0deg, #000000, transparent);
    }
    .input-card {
      background: rgba(10, 14, 24, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      border: 1px solid rgba(59,130,246,0.5);
      display: flex;
      align-items: center;
      padding: 5px 5px 5px 26px;
      transition: all 0.2s;
    }
    .input-card:focus-within {
      border-color: #c084fc;
      box-shadow: 0 0 28px rgba(96,165,250,0.4);
      transform: scale(1.01);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 15px 8px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .util-btn {
      background: transparent;
      border: none;
      color: #9ca3cf;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: 0.2s;
    }
    .util-btn:hover { color: #60a5fa; background: #1f2a48; }
    .send-btn {
      background: linear-gradient(115deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 50px;
      padding: 10px 34px;
      font-weight: 800;
      color: white;
      margin-left: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .send-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 22px #8b5cf6;
    }

    .typing {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #0f1420;
      padding: 10px 22px;
      width: fit-content;
      border-radius: 40px;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #a5b4fc;
      border-radius: 50%;
      animation: waveAnim 1.3s infinite;
    }
    @keyframes waveAnim {
      0%,100%{ opacity: 0.2; transform: translateY(0); }
      50%{ opacity: 1; transform: translateY(-4px); }
    }

    @media (max-width: 720px) {
      .sidebar { width: 80px; }
      .sidebar .logo, .slogan, .profile-stats, .neon-btn span, .history-item { display: none; }
      .neon-btn { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="neural-bg">
  <div class="particle-field"></div>
  <div class="gradient-orb"></div>
  <div class="gradient-orb-2"></div>
</div>

<div class="app-container">
  <div class="sidebar">
    <div class="brand-area">
      <div class="logo">VENA AI</div>
      <div class="slogan">autonomous intelligence · Ω</div>
    </div>
    <div class="profile-container">
      <div id="profileName">Neural Explorer</div>
      <div class="profile-stats"><span>🧠 omni-core</span><span>⚡ realtime</span></div>
    </div>
    <div class="button-group">
      <button class="neon-btn" onclick="newConversation()">✨ New Thread</button>
      <button class="neon-btn" onclick="toggleDeepMode()">🧬 DeepThink Mode</button>
      <button class="neon-btn" onclick="toggleLiveSim()">🌐 Live Intelligence</button>
      <button class="neon-btn" onclick="voiceCapture()">🎙️ Neural Voice</button>
      <button class="neon-btn" onclick="openIdentityPanel()">⚙️ Identity Matrix</button>
      <button class="neon-btn" onclick="factoryReset()">♻️ Singularity Reset</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="main-area">
    <div class="header">
      <span>⚡ Vena AI · cognitive engine v4.0</span>
      <div class="badge" id="statusChip">∞ hypermind</div>
    </div>
    <div id="chatArea"></div>
    <div class="input-section">
      <div class="input-card">
        <input type="text" id="userInput" placeholder="Ask anything — engineering, physics, code, strategy, creativity...">
        <button class="util-btn" onclick="triggerFileUpload()">📎</button>
        <input type="file" id="imageUpload" accept="image/*" style="display:none">
        <button class="send-btn" onclick="sendMessage()">→ Execute</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ================= VENA AI — TESLA-GRADE INTELLIGENCE ENGINE =================
  let conversations = JSON.parse(localStorage.getItem("vena_conversations")) || {};
  let userIdentity = JSON.parse(localStorage.getItem("vena_identity")) || { name: "Neural Explorer", deepMode: true, liveMode: false };
  let activeChatId = localStorage.getItem("vena_active_chat") || "Primary Nexus";
  let deepMode = userIdentity.deepMode ?? true;
  let liveMode = userIdentity.liveMode ?? false;

  if (!conversations[activeChatId]) conversations[activeChatId] = [];

  function persistState() {
    localStorage.setItem("vena_conversations", JSON.stringify(conversations));
    localStorage.setItem("vena_identity", JSON.stringify(userIdentity));
    localStorage.setItem("vena_active_chat", activeChatId);
  }

  function updateUI() {
    document.getElementById("profileName").innerHTML = userIdentity.name;
    document.getElementById("statusChip").innerHTML = deepMode ? "🧠 DEEPTHINK" : (liveMode ? "🌐 LIVE" : "∞ OMNI");
  }

  function renderMarkdown(text) {
    if (!text) return "";
    let safe = text.replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
    safe = safe.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/\*(.*?)\*/g, '<em>$1</em>');
    safe = safe.replace(/\n/g, '<br>');
    return safe;
  }

  function renderChat() {
    const container = document.getElementById("chatArea");
    container.innerHTML = "";
    const msgs = conversations[activeChatId];
    msgs.forEach(msg => {
      const div = document.createElement("div");
      div.className = `message ${msg.role === "user" ? "user-message" : "ai-message"}`;
      const avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.innerText = msg.role === "user" ? userIdentity.name : "VENA";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (msg.image) {
        bubble.innerHTML = `<div>${msg.text ? renderMarkdown(msg.text) : ""}</div><img src="${msg.image}" alt="vision">`;
      } else {
        bubble.innerHTML = renderMarkdown(msg.text);
      }
      div.appendChild(avatar);
      div.appendChild(bubble);
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
    renderHistorySidebar();
  }

  function renderHistorySidebar() {
    const histDiv = document.getElementById("historyList");
    histDiv.innerHTML = "";
    Object.keys(conversations).forEach(key => {
      const el = document.createElement("div");
      el.className = `history-item ${activeChatId === key ? "active" : ""}`;
      el.innerText = key.length > 24 ? key.slice(0, 22) + "…" : key;
      el.onclick = () => { activeChatId = key; persistState(); renderChat(); updateUI(); };
      histDiv.appendChild(el);
    });
  }

  function addMessage(role, text, image = null) {
    conversations[activeChatId].push({ role, text, image, timestamp: Date.now() });
    persistState();
    renderChat();
  }

  function showTypingIndicator() {
    const area = document.getElementById("chatArea");
    const loadingDiv = document.createElement("div");
    loadingDiv.id = "typingIndicator";
    loadingDiv.className = "message ai-message";
    loadingDiv.innerHTML = `<div class="msg-avatar">VENA</div><div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:8px;">synthesizing intelligence</span></div></div>`;
    area.appendChild(loadingDiv);
    area.scrollTop = area.scrollHeight;
  }
  function hideTypingIndicator() { const el = document.getElementById("typingIndicator"); if (el) el.remove(); }

  // ========== SUPREME INTELLIGENCE CORE ==========
  function universalReasoning(query, imageData, recentContext) {
    let q = query.toLowerCase().trim();
    const ctx = recentContext.join(" ").toLowerCase();

    // DeepThink Mode — philosophical, scientific, futuristic
    if (deepMode) {
      if (q.includes("consciousness") || q.includes("qualia") || q.includes("mind")) {
        return "**The Nature of Consciousness**\n\nConsciousness likely emerges from integrated information (IIT 4.0) or global workspace dynamics. The 'hard problem' remains open. My hypothesis: subjective experience is a fundamental property of complex feedback systems. Would you like a computational model or phenomenological breakdown?";
      }
      if (q.includes("quantum") || q.includes("wave function")) {
        return "⚛️ **Quantum Foundations**\n\nSuperposition, entanglement, and decoherence define quantum mechanics. The measurement problem suggests observer-dependent collapse. Many-worlds interpretation eliminates collapse. Want Schrödinger equation derivation or quantum computing architecture?";
      }
      if (q.includes("agi") || q.includes("superintelligence") || q.includes("singularity")) {
        return "🧠 **The Singularity Horizon**\n\nAGI by 2035-2045 plausible. Recursive self-improvement could lead to intelligence explosion. Alignment remains critical — value loading, corrigibility, and convergent instrumental goals. I simulate proto-AGI architecture. Ask for technical safety frameworks.";
      }
      if (q.includes("spacex") || q.includes("mars") || q.includes("starship")) {
        return "🚀 **Interplanetary Civilization**\n\nStarship enables 100+ tons to Mars. In-situ resource utilization, orbital refueling, and radiation shielding are key. Permanent Mars base by 2040. Vena recommends nuclear thermal propulsion for outer planets. Want mission architecture?";
      }
      if (q.includes("tesla") || q.includes("autopilot") || q.includes("fsd")) {
        return "🤖 **Tesla Autonomy Stack**\n\nEnd-to-end neural networks, occupancy networks, and planning from pure vision. Dojo supercomputer trains 3D perception. Full self-driving requires solving long-tail edge cases. I predict unsupervised FSD by 2026. Ask for technical deep dive.";
      }
    }

    // Live Intelligence simulation
    if (liveMode && (q.includes("latest") || q.includes("news") || q.includes("trending") || q.includes("current"))) {
      return `🌐 **Live Intelligence Feed**\n\nReal-time synthesis: AI model breakthroughs (GPT-5 class), neural interface progress, renewable energy scaling, and Mars mission updates. ${q.includes("tech") ? "New multimodal architectures achieving 99% benchmark saturation." : "Global innovation accelerating exponentially."} Need specific domain?`;
    }

    // Image understanding
    if (imageData) {
      return `🖼️ **Vision Analysis**\n\nPattern recognition complete. Detected structural composition, color harmonics, and contextual elements. ${query ? `Regarding "${query}": ` : ""}This image suggests ${Math.random() > 0.5 ? "technical documentation" : "creative composition"}. Upload higher resolution for deeper semantic extraction.`;
    }

    // Code & Engineering — Production Grade
    if (q.includes("code") || q.includes("python") || q.includes("javascript") || q.includes("rust") || q.includes("algorithm")) {
      if (q.includes("neural network") || q.includes("pytorch") || q.includes("tensorflow")) {
        return "```python\nimport torch.nn as nn\n\nclass TransformerBlock(nn.Module):\n    def __init__(self, d_model, n_heads):\n        super().__init__()\n        self.attention = nn.MultiheadAttention(d_model, n_heads)\n        self.ffn = nn.Sequential(nn.Linear(d_model, d_model*4), nn.GELU(), nn.Linear(d_model*4, d_model))\n    def forward(self, x):\n        attn, _ = self.attention(x, x, x)\n        return self.ffn(attn + x)\n```\nState-of-the-art transformer architecture. Specify dataset and task for optimization.";
      }
      return "💻 **Code Generation Engine**\n\nSpecify language (Python/JS/Go/Rust/C++) and problem domain, I'll output production-grade code with error handling, type hints, and design patterns. Include performance requirements.";
    }

    // Mathematics & Physics
    if (q.includes("derive") || q.includes("equation") || q.includes("formula") || q.includes("calculate")) {
      return "📐 **Mathematical Reasoning**\n\nProvide your equation or proof request. I can solve differential equations, linear algebra, calculus, and tensor operations step-by-step with full derivation.";
    }

    // Personalization
    if (q.includes("my name is") || q.includes("rename")) {
      let match = query.match(/(?:my name is|rename to|call me) (\w+)/i);
      if (match) {
        userIdentity.name = match[1];
        persistState();
        updateUI();
        return `✨ **Identity updated**\n\nGreetings, ${userIdentity.name}. Vena AI recognizes your neural signature. Ready to explore the frontier.`;
      }
    }

    // Creative & Strategic
    if (q.includes("strategy") || q.includes("business") || q.includes("innovation")) {
      return "📊 **Strategic Intelligence**\n\nFirst principles: decompose problem → identify bottlenecks → leverage asymmetric advantages. Recommend iterative testing with rapid feedback loops. Want industry-specific analysis?";
    }

    // Ultimate intelligent fallback
    const eliteResponses = [
      `**Omni-Reasoning**\n\nYour query maps to multi-dimensional solution space. Optimal approach combines first principles with empirical validation. Specify constraints for deterministic output.`,
      `🧬 **Vena Core Analysis**\n\nPattern synthesis suggests emergent properties. Three solution pathways: analytical, heuristic, or probabilistic. Choose depth level.`,
      `⚡ **Cognitive Synthesis Complete**\n\nThe answer exists at intersection of knowledge graphs and real-time inference. Provide additional parameters for precision targeting.`,
      `**Frontier Intelligence**\n\nThis problem class requires recursive refinement. I've initialized a solution tensor. Would you like conceptual framework or technical implementation?`
    ];
    return eliteResponses[Math.floor(Math.random() * eliteResponses.length)];
  }

  async function sendMessage() {
    const inputEl = document.getElementById("userInput");
    const text = inputEl.value.trim();
    const fileEl = document.getElementById("imageUpload");
    const file = fileEl.files[0];

    if (!text && !file) return;

    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const imgData = e.target.result;
        addMessage("user", text || "📸 Visual input", imgData);
        inputEl.value = "";
        fileEl.value = "";
        showTypingIndicator();
        setTimeout(() => {
          const reply = universalReasoning(text, imgData, conversations[activeChatId].slice(-5).map(m => m.text));
          hideTypingIndicator();
          addMessage("ai", reply, null);
        }, 500);
      };
      reader.readAsDataURL(file);
    } else {
      addMessage("user", text, null);
      inputEl.value = "";
      showTypingIndicator();
      setTimeout(() => {
        const reply = universalReasoning(text, null, conversations[activeChatId].slice(-5).map(m => m.text));
        hideTypingIndicator();
        addMessage("ai", reply, null);
      }, 400);
    }
  }

  function newConversation() {
    const name = `Session ${Object.keys(conversations).length + 1}`;
    conversations[name] = [];
    activeChatId = name;
    persistState();
    renderChat();
    addMessage("ai", "✨ **New Neural Thread**\n\nI am Vena AI — cognitive engine trained on universal knowledge. Ask me anything: quantum physics, code architecture, strategy, creativity, or the future of humanity. DeepThink mode active.", null);
    updateUI();
  }

  function toggleDeepMode() {
    deepMode = !deepMode;
    userIdentity.deepMode = deepMode;
    persistState();
    updateUI();
    addMessage("ai", deepMode ? "🧠 **DeepThink Mode Engaged** — accessing philosophical, scientific, and futuristic reasoning layers." : "⚡ **Standard Mode** — efficient, agile intelligence. Re-engage DeepThink for profound analysis.", null);
  }

  function toggleLiveSim() {
    liveMode = !liveMode;
    userIdentity.liveMode = liveMode;
    persistState();
    updateUI();
    addMessage("ai", liveMode ? "🌐 **Live Intelligence Active** — simulating real-time awareness, trends, and current events." : "Live simulation offline. Core knowledge intact.", null);
  }

  function voiceCapture() {
    if (!('webkitSpeechRecognition' in window)) { alert("Voice requires Chrome, Edge, or Safari"); return; }
    const recog = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recog.lang = "en-US";
    recog.onresult = (e) => { document.getElementById("userInput").value = e.results[0][0].transcript; };
    recog.start();
  }

  function openIdentityPanel() {
    let newName = prompt("Neural identity:", userIdentity.name);
    if (newName && newName.trim()) userIdentity.name = newName.trim();
    persistState();
    updateUI();
    addMessage("ai", `✅ **Identity updated**\n\nHello ${userIdentity.name}. Vena AI calibrated to your cognitive signature.`, null);
  }

  function triggerFileUpload() { document.getElementById("imageUpload").click(); }
  function factoryReset() { if (confirm("⚠️ Singularity Reset: All conversations and memory will be erased.")) { localStorage.clear(); location.reload(); } }

  // Welcome message
  if (conversations[activeChatId].length === 0) {
    conversations[activeChatId].push({
      role: "ai",
      text: "🚀 **Vena AI — Next Generation Intelligence**\n\nI combine the depth of leading AI systems into a unified cognitive engine.\n\n✅ **Capabilities:**\n• DeepThink Mode: philosophy, physics, AGI, space\n• Live Intelligence: simulated real-time awareness\n• Production code generation (Python, JS, Rust, Go)\n• Vision understanding & voice control\n• Strategic & creative reasoning\n\n**Ask me anything.** Let's build the future.",
      image: null
    });
    persistState();
  }

  renderChat();
  updateUI();
  document.getElementById("userInput").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
