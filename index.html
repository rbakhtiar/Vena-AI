  async function sendGodMessage() {
    const inputEl = document.getElementById("promptInput");
    const text = inputEl.value.trim();
    const fileEl = document.getElementById("imageUpload");
    const file = fileEl.files[0];
    
    if (!text && !file) return;
    
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const imgData = e.target.result;
        addGodMessage("user", text || "📸 Divine vision", imgData);
        inputEl.value = "";
        fileEl.value = "";
        showGodTyping();
        setTimeout(() => {
          const reply = godAnswer(text, imgData, godChats[activeGodChat].slice(-6).map(m => m.text));
          hideGodTyping();
          addGodMessage("ai", reply, null);
        }, 550);
      };
      reader.readAsDataURL(file);
    } else {
      addGodMessage("user", text, null);
      inputEl.value = "";
      showGodTyping();
      setTimeout(() => {
        const reply = godAnswer(text, null, godChats[activeGodChat].slice(-6).map(m => m.text));
        hideGodTyping();
        addGodMessage("ai", reply, null);
      }, 450);
    }
  }
