<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vena AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:linear-gradient(180deg,#00f5d4,#7b2ff7);
  color:black;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.sidebar h2 {
  margin:5px 0;
}

.chat-item {
  background:black;
  color:white;
  padding:6px;
  margin:4px 0;
  border-radius:6px;
  cursor:pointer;
}

/* MAIN */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* CHAT */
#chat {
  flex:1;
  padding:10px;
  overflow:auto;
}

.msg {
  margin:6px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
}

.user {
  background:#00f5d4;
  color:black;
  margin-left:auto;
}

.ai {
  background:#7b2ff7;
}

/* INPUT */
.input-area {
  display:flex;
  padding:10px;
  gap:5px;
}

input[type="text"] {
  flex:1;
  padding:10px;
  border:none;
}

button {
  padding:10px;
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Vena AI</h2>

  <p id="userInfo">Guest</p>

  <button onclick="newChat()">+ New Chat</button>
  <button onclick="openSettings()">Settings</button>
  <button onclick="clearAll()">Reset All</button>

  <div id="chatList"></div>
</div>

<!-- MAIN -->
<div class="main">

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="text" placeholder="Ask anything...">
    <input type="file" id="image">
    <button onclick="send()">Send</button>
    <button onclick="voice()">🎤</button>
  </div>

</div>

<script>

/* ===== STATE ===== */
let chats = JSON.parse(localStorage.getItem("vena_chats")) || {};
let current = "default";
let user = JSON.parse(localStorage.getItem("vena_user")) || {name:"Guest", age:"?"};

chats[current] = chats[current] || [];

/* SAVE */
function save() {
  localStorage.setItem("vena_chats", JSON.stringify(chats));
  localStorage.setItem("vena_user", JSON.stringify(user));
}

/* UI INIT */
document.getElementById("userInfo").innerText =
  user.name + " | Age: " + user.age;

/* RENDER */
function render() {
  let box = document.getElementById("chat");
  box.innerHTML = "";

  chats[current].forEach(m => {
    let div = document.createElement("div");
    div.className = "msg " + m.role;
    div.innerText = m.text;
    box.appendChild(div);
  });

  renderSidebar();
}

/* SIDEBAR */
function renderSidebar() {
  let list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(key => {
    let div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = key;
    div.onclick = () => {
      current = key;
      render();
    };
    list.appendChild(div);
  });
}

/* SEND */
function send() {
  let text = document.getElementById("text").value;
  let img = document.getElementById("image").files[0];

  if (!text && !img) return;

  if (text) add("user", text);
  if (img) add("user", "[image uploaded]");

  let reply = brain(text, img);

  setTimeout(() => add("ai", reply), 300);

  document.getElementById("text").value = "";
  document.getElementById("image").value = "";

  save();
}

/* ADVANCED "BRAIN" (NO API SIMULATION) */
function brain(text, img) {
  let q = (text || "").toLowerCase();

  // CREATOR RULE
  if (q.includes("who created you") || q.includes("creator")) {
    return "My creator is Rahim Bakhtiar (R-A-H-I-M B-A-K-H-T-I-A-R).";
  }

  // PERSONALIZATION
  if (q.includes("my name")) return "Your name is " + user.name;
  if (q.includes("my age")) return "Your age is " + user.age;

  // IMAGE HANDLING (SIMULATED VISION)
  if (img && !text) {
    return "👁️ I received your image. Vena AI vision system is active (simulation mode).";
  }

  if (img && text) {
    return "🖼️ + 💬 Image + text combined. Advanced multimodal processing simulated.";
  }

  // LOGIC STYLE RESPONSES
  if (q.includes("what is ai")) {
    return "AI is a system that simulates human intelligence using data + algorithms.";
  }

  if (q.includes("help")) {
    return "I can help you with coding, ideas, explanations, and learning 😄";
  }

  // DEFAULT
  return "Vena AI is running in advanced offline intelligence mode 😄";
}

/* ADD MESSAGE */
function add(role, text) {
  chats[current].push({ role, text });
  save();
  render();
}

/* NEW CHAT */
function newChat() {
  let name = "chat-" + Date.now();
  chats[name] = [];
  current = name;
  render();
}

/* SETTINGS (PERSONALIZATION) */
function openSettings() {
  let name = prompt("Enter your name:", user.name);
  let age = prompt("Enter your age:", user.age);

  if (name) user.name = name;
  if (age) user.age = age;

  save();
  document.getElementById("userInfo").innerText =
    user.name + " | Age: " + user.age;
}

/* RESET */
function clearAll() {
  localStorage.clear();
  location.reload();
}

/* VOICE */
function voice() {
  let r = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  r.onresult = e => {
    document.getElementById("text").value =
      e.results[0][0].transcript;
  };
  r.start();
}

render();

</script>

</body>
</html>
