<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENA AI</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
}

:root{
--bg:#050510;
--card:#10101f;
--accent:#7c4dff;
--pink:#ff4fa3;
--text:#f5f5ff;
--muted:#8b8bb4;
}

body{
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:270px;
background:#0c0c18;
border-right:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
}

.brand{
padding:22px;
font-size:26px;
font-weight:900;
background:linear-gradient(90deg,var(--accent),var(--pink));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.newchat{
margin:0 18px 18px;
padding:12px;
border:none;
border-radius:14px;
cursor:pointer;
background:linear-gradient(135deg,var(--accent),var(--pink));
color:white;
font-weight:700;
}

.chatlist{
flex:1;
overflow:auto;
padding:10px;
}

.chatitem{
padding:12px;
border-radius:12px;
cursor:pointer;
margin-bottom:8px;
background:#151527;
transition:.2s;
}

.chatitem:hover{
background:#1e1e36;
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
padding:18px 26px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.06);
}

.title{
font-size:20px;
font-weight:800;
}

.messages{
flex:1;
overflow:auto;
padding:24px;
display:flex;
flex-direction:column;
gap:18px;
}

.msg{
max-width:78%;
padding:16px;
border-radius:18px;
line-height:1.7;
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#5e39d6,#9233aa);
}

.ai{
align-self:flex-start;
background:var(--card);
border:1px solid rgba(255,255,255,.06);
}

.inputwrap{
padding:20px;
border-top:1px solid rgba(255,255,255,.06);
}

.row{
display:flex;
gap:10px;
}

textarea{
flex:1;
background:#111120;
border:none;
outline:none;
resize:none;
padding:16px;
border-radius:16px;
font-size:15px;
color:white;
}

.send{
padding:16px 24px;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:800;
background:linear-gradient(135deg,var(--accent),var(--pink));
color:white;
}

.orb{
position:fixed;
border-radius:50%;
filter:blur(120px);
opacity:.22;
pointer-events:none;
}

.o1{
width:500px;
height:500px;
background:#6f43ff;
top:-150px;
right:-100px;
}

.o2{
width:400px;
height:400px;
background:#ff4fa3;
bottom:-140px;
left:-90px;
}

</style>
</head>

<body>

<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="sidebar">

<div class="brand">
VENA AI
</div>

<button class="newchat">
＋ New Chat
</button>

<div class="chatlist">

<div class="chatitem">
Welcome Chat
</div>

</div>

</div>

<div class="main">

<div class="topbar">

<div class="title">
VENA AI — By Rahim Bakhtiar
</div>

</div>

<div class="messages" id="messages">

<div class="msg ai">
Hello. I am VENA AI.
Ask me anything.
</div>

</div>

<div class="inputwrap">

<div class="row">

<textarea
id="input"
placeholder="Ask VENA anything..."
rows="1"></textarea>

<button
class="send"
onclick="send()">
Send →
</button>

</div>

</div>

</div>

<script>

const messages =
document.getElementById("messages");

async function send(){

const input =
document.getElementById("input");

const text =
input.value.trim();

if(!text) return;

messages.innerHTML += `
<div class="msg user">
${text}
</div>
`;

input.value = "";

messages.innerHTML += `
<div class="msg ai" id="typing">
Thinking...
</div>
`;

messages.scrollTop =
messages.scrollHeight;

/* AI BACKEND */

try{

const res =
await fetch(
'https://text.pollinations.ai/openai',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

model:'openai',

messages:[

{
role:'system',
content:
'You are VENA AI. Brilliant, helpful, deep, powerful.'
},

{
role:'user',
content:text
}

]

})
});

const data =
await res.json();

document
.getElementById("typing")
.remove();

messages.innerHTML += `
<div class="msg ai">
${data.choices?.[0]?.message?.content || "No response."}
</div>
`;

}
catch(e){

document
.getElementById("typing")
.remove();

messages.innerHTML += `
<div class="msg ai">
Backend error.
</div>
`;

}

messages.scrollTop =
messages.scrollHeight;

}

</script>

</body>
</html>
