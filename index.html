<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VENA AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b0f19;
  --panel:#111827;
  --text:#ffffff;
  --ai:#1f2937;
  --user:#00f5d4;
}

.light{
  --bg:#f6f7fb;
  --panel:#ffffff;
  --text:#111;
  --ai:#e5e7eb;
  --user:#00c2a8;
}

body{
margin:0;
height:100vh;
display:flex;
font-family:system-ui;
background:var(--bg);
color:var(--text);
transition:0.3s;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:var(--panel);
padding:12px;
display:flex;
flex-direction:column;
}

.brand{
font-weight:700;
margin-bottom:10px;
}

.chatItem{
padding:10px;
margin:5px 0;
background:rgba(0,0,0,0.05);
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* CHAT */
#chat{
flex:1;
padding:18px;
overflow:auto;
}

.msg{
max-width:75%;
padding:12px;
margin:10px 0;
border-radius:12px;
white-space:pre-wrap;
line-height:1.4;
animation:fade 0.2s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}

.user{background:var(--user);color:black;margin-left:auto}
.ai{background:var(--ai)}

/* INPUT */
.inputBar{
display:flex;
padding:12px;
background:var(--panel);
gap:8px;
align-items:center;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:transparent;
color:var(--text);
outline:none;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
background:var(--user);
}

/* MIC */
.mic{
width:42px;
height:42px;
border-radius:10px;
background:rgba(0,0,0,0.08);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:var(--panel);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="brand">VENA AI</div>
<button onclick="toggleMode()">🌗 Mode</button>
<button onclick="newChat()">+ New Chat</button>
<div id="list"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>Chat</div>
<div onclick="clearAll()" style="cursor:pointer">Clear</div>
</div>

<div id="chat"></div>

<div class="inputBar">

<div class="mic" onclick="voice()">🎤</div>

<input id="text" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()">

<button onclick="send()">➤</button>

</div>

</div>

<script>

let chat=document.getElementById("chat");
let chats={};
let current="default";
chats[current]=[];

/* MODE */
function toggleMode(){
document.body.classList.toggle("light");
}

/* CHAT SYSTEM */
function newChat(){
current="chat_"+Date.now();
chats[current]=[];
render();
chat.innerHTML="";
}

function render(){
list.innerHTML="";
for(let c in chats){
let d=document.createElement("div");
d.className="chatItem";
d.innerText=c;
d.onclick=()=>load(c);
list.appendChild(d);
}
}

function load(id){
current=id;
chat.innerHTML="";
chats[id].forEach(m=>add(m.role,m.text));
}

/* AI ENGINE */
function brain(t){
t=t.toLowerCase();

if(t.includes("who created you")){
return "My creator is Rahim Bakhtiar.";
}

if(t.includes("ai")){
return "AI simulates human intelligence using data and patterns.";
}

if(t.includes("future")){
return "The future depends on technology and human decisions.";
}

if(t.includes("code")){
return "Code is structured instructions that run software systems.";
}

return "VENA AI processed your request with structured reasoning.";
}

/* SEND */
function send(){
let t=text.value;
if(!t)return;

add("user",t);
let res=brain(t);
add("ai",res);

if(!chats[current])chats[current]=[];
chats[current].push({role:"user",text:t});
chats[current].push({role:"ai",text:res});

text.value="";
render();
}

/* UI */
function add(r,t){
let d=document.createElement("div");
d.className="msg "+r;
d.innerText=t;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}

/* VOICE */
function voice(){
let r=new webkitSpeechRecognition();
r.onresult=e=>{
text.value=e.results[0][0].transcript;
};
r.start();
}

/* CLEAR */
function clearAll(){
chat.innerHTML="";
}

render();

</script>

</body>
</html>
