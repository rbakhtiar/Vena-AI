<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VENA AI · Hypernova</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--v:#7c4fff;--v2:#ff4f9a;--v3:#ffb040;--f:'Outfit',sans-serif;--mono:'DM Mono',monospace;}
[data-theme="dark"]{
  --bg:#03030c;--sb:#060616;--s2:#0b0b1e;--s3:#101028;
  --br:rgba(124,79,255,0.13);--brh:rgba(124,79,255,0.42);
  --tx:#edeaff;--mu:#353350;--m2:#8a87aa;
  --bai:rgba(10,10,24,0.98);--tb:rgba(3,3,12,0.92);--ib:#0b0b1e;
  --gr:#34d77a;--re:#ff4f6a;--sh:rgba(0,0,0,0.6);
}
[data-theme="light"]{
  --bg:#f0efff;--sb:#ffffff;--s2:#eceaff;--s3:#e2dfff;
  --br:rgba(124,79,255,0.13);--brh:rgba(124,79,255,0.4);
  --tx:#16142a;--mu:#c8c6e0;--m2:#68668a;
  --bai:#ffffff;--tb:rgba(240,239,255,0.94);--ib:#ffffff;
  --gr:#15a356;--re:#d92a2a;--sh:rgba(124,79,255,0.08);
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--tx);display:flex;height:100vh;transition:background .25s,color .25s;}
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.7;}
.orb1{width:700px;height:700px;background:radial-gradient(circle,rgba(124,79,255,0.22),transparent);top:-200px;right:-150px;animation:o1 30s ease-in-out infinite alternate;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,79,154,0.15),transparent);bottom:-160px;left:-120px;animation:o2 24s ease-in-out infinite alternate;}
.orb3{width:350px;height:350px;background:radial-gradient(circle,rgba(255,176,64,0.1),transparent);top:40%;left:35%;animation:o3 36s ease-in-out infinite alternate;}
[data-theme="light"] .orb{opacity:.32;}
@keyframes o1{0%{transform:translate(0,0)scale(1);}100%{transform:translate(35px,25px)scale(1.12);}}
@keyframes o2{0%{transform:translate(0,0);}100%{transform:translate(-22px,-18px)scale(1.1);}}
@keyframes o3{0%{transform:translate(0,0);}100%{transform:translate(20px,30px);}}
.sidebar{width:260px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--br);display:flex;flex-direction:column;z-index:10;transition:background .35s;}
.sbt{padding:20px 15px 14px;border-bottom:1px solid var(--br);}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:15px;}
.bico{width:42px;height:42px;background:linear-gradient(135deg,var(--v),var(--v2));border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 0 28px rgba(124,79,255,0.45);}
.bname{font-size:20px;font-weight:900;letter-spacing:-.6px;background:linear-gradient(90deg,#b09fff,#ff85bc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bsub{font-size:8px;color:var(--m2);letter-spacing:.16em;text-transform:uppercase;}
.nbtn{width:100%;background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:11px;border-radius:11px;color:#fff;font-family:var(--f);font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;}
.nbtn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(124,79,255,.38);}
.slbl{font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--m2);text-transform:uppercase;padding:14px 15px 5px;}
.psel{width:calc(100% - 24px);margin:0 12px 4px;background:var(--s2);border:1px solid var(--br);border-radius:10px;padding:8px 11px;color:var(--tx);font-family:var(--f);font-size:12px;outline:none;}
.cl{flex:1;overflow-y:auto;padding:3px 8px;}
.cl::-webkit-scrollbar{width:3px;}
.cl::-webkit-scrollbar-thumb{background:rgba(124,79,255,.18);}
.ci{padding:9px 10px;border-radius:10px;font-size:12.5px;color:var(--m2);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.cdot{width:5px;height:5px;border-radius:50%;background:rgba(124,79,255,.22);}
.ci:hover{background:var(--s2);color:var(--tx);}
.ci.active{background:var(--s3);color:var(--tx);}
.ci.active .cdot{background:var(--v);box-shadow:0 0 8px var(--v);}
.clbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cax{display:flex;gap:2px;opacity:0;transition:.14s;}
.ci:hover .cax{opacity:1;}
.cxb{font-size:11px;padding:2px 5px;border-radius:4px;cursor:pointer;background:transparent;color:var(--m2);}
.cxb:hover{color:var(--tx);}
.rni{background:var(--s2);border:1px solid var(--v);border-radius:6px;padding:3px 8px;color:var(--tx);font-size:12px;outline:none;}
.sbf{padding:12px 14px;border-top:1px solid var(--br);display:flex;flex-direction:column;gap:7px;}
.lp{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--m2);background:var(--s2);padding:8px 12px;border-radius:10px;}
.ld{width:6px;height:6px;background:var(--gr);border-radius:50%;box-shadow:0 0 8px var(--gr);animation:lpa 2.5s infinite;}
@keyframes lpa{0%,100%{opacity:1;}50%{opacity:.3;}}
.ctag{font-size:8.5px;color:var(--m2);text-align:center;}
.ctag b{background:linear-gradient(90deg,var(--v),var(--v2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:5;}
.topbar{padding:12px 24px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;background:var(--tb);backdrop-filter:blur(24px);}
.tl{display:flex;align-items:center;gap:10px;}
.tico{width:26px;height:26px;background:linear-gradient(135deg,var(--v),var(--v2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;}
.tname{font-size:15px;font-weight:800;background:linear-gradient(90deg,#b09fff,#ff85bc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tr{display:flex;gap:7px;}
.xbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--br);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.15s;color:var(--tx);}
.xbtn:hover{background:var(--s2);border-color:var(--brh);}
#msgs{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
#msgs::-webkit-scrollbar{width:4px;}
#msgs::-webkit-scrollbar-thumb{background:rgba(124,79,255,.18);}
.mw{display:flex;flex-direction:column;max-width:82%;animation:mp .2s ease-out;}
@keyframes mp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.mw.user{align-self:flex-end;}.mw.ai{align-self:flex-start;}
.mm{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;padding:0 5px;display:flex;align-items:center;gap:5px;}
.mw.user .mm{justify-content:flex-end;color:rgba(124,79,255,.72);}
.mw.ai .mm{color:rgba(255,79,154,.72);}
.mdot{width:4px;height:4px;border-radius:50%;background:currentColor;}
.bbl{padding:13px 16px;border-radius:18px;font-size:13.5px;line-height:1.72;}
.user .bbl{background:linear-gradient(135deg,rgba(80,45,215,.92),rgba(162,46,122,.82));border-bottom-right-radius:4px;border:1px solid rgba(124,79,255,.25);color:#fff;}
.ai .bbl{background:var(--bai);border:1px solid var(--br);border-bottom-left-radius:4px;color:var(--tx);box-shadow:0 2px 16px var(--sh);}
.bbl pre{background:rgba(0,0,0,.48);padding:12px;border-radius:10px;overflow-x:auto;margin:9px 0;font-family:var(--mono);font-size:12px;}
.bbl code:not(pre code){background:rgba(124,79,255,.17);padding:1px 6px;border-radius:4px;}
.bbl strong{color:#cbb8ff;}.bbl h1{font-size:17px;color:#c8b4ff;margin:12px 0 5px;}
.bbl h2{font-size:15px;color:#c8b4ff;margin:10px 0 4px;}
.bbl blockquote{border-left:3px solid var(--v);padding-left:12px;color:var(--m2);margin:7px 0;}
.bbl table{border-collapse:collapse;width:100%;margin:9px 0;font-size:12.5px;}
.bbl th, .bbl td{padding:7px 11px;border:1px solid var(--br);text-align:left;}
.mac{display:flex;gap:5px;margin-top:6px;padding:0 5px;}
.mw.user .mac{justify-content:flex-end;}
.mb{font-size:10px;color:var(--m2);cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid var(--br);background:var(--s2);transition:.14s;}
.mb:hover{color:var(--tx);border-color:var(--v);}
.scur{display:inline-block;width:2px;height:15px;background:var(--v2);margin-left:2px;animation:blink .65s infinite;vertical-align:middle;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.wlc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;}
.wico{width:76px;height:76px;background:linear-gradient(135deg,var(--v),var(--v2));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff;box-shadow:0 0 60px rgba(124,79,255,.5);}
.wtit{font-size:36px;font-weight:900;background:linear-gradient(90deg,#c8aaff,#ff88bb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:560px;}
.chip{background:var(--s2);border:1px solid var(--br);padding:8px 15px;border-radius:24px;font-size:12px;cursor:pointer;transition:.18s;}
.chip:hover{border-color:var(--v);color:var(--tx);transform:translateY(-2px);}
.ia{padding:12px 24px 16px;background:var(--tb);border-top:1px solid var(--br);backdrop-filter:blur(22px);}
.toolbar{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.tbtn{font-size:11px;color:var(--m2);cursor:pointer;padding:5px 10px;border-radius:8px;border:1px solid var(--br);background:var(--s2);transition:.15s;white-space:nowrap;}
.tbtn:hover{border-color:var(--v);color:var(--tx);}
.tbtn.on{border-color:var(--v);color:var(--v);background:rgba(124,79,255,.11);}
.tbtn.lst{border-color:var(--v2);animation:pb 1s infinite;}
@keyframes pb{0%,100%{opacity:1;}50%{opacity:.55;}}
.ithumb{max-height:48px;border-radius:7px;margin-bottom:7px;}
.irow{display:flex;gap:8px;background:var(--ib);border-radius:15px;padding:5px 5px 5px 17px;border:1px solid var(--br);align-items:flex-end;}
#inp{flex:1;background:transparent;border:none;color:var(--tx);font-size:14px;font-family:var(--f);outline:none;padding:10px 0;resize:none;max-height:130px;line-height:1.55;}
.sbtn{background:linear-gradient(135deg,var(--v),var(--v2));border:none;padding:10px 24px;border-radius:11px;color:#fff;font-weight:700;cursor:pointer;transition:.16s;}
.sbtn:disabled{opacity:.32;cursor:not-allowed;}
.hint{font-size:9px;color:var(--m2);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="sidebar">
  <div class="sbt"><div class="brand"><div class="bico">V</div><div><div class="bname">VENA AI</div><div class="bsub">Hypernova · Rahim Bakhtiar</div></div></div><button class="nbtn" onclick="newChat()">＋ New Chat</button></div>
  <div class="slbl">Persona</div><select class="psel" id="psel" onchange="persona=this.value"><option value="default">🤖 VENA Default</option><option value="genius">🧠 Genius Analyst</option><option value="coder">💻 Code Expert</option><option value="philosopher">🔮 Philosopher</option><option value="scientist">🔬 Scientist</option><option value="creative">✍️ Creative Writer</option><option value="tutor">📚 Tutor</option></select>
  <div class="slbl">Conversations</div><div class="cl" id="cl"></div>
  <div class="sbf"><div class="lp"><div class="ld"></div><span id="statuslbl">VENA Ready ⚡</span></div><div class="ctag">Created by <b>Rahim Bakhtiar</b></div></div>
</div>
<div class="main">
  <div class="topbar"><div class="tl"><div class="tico">V</div><span class="tname">VENA AI</span></div><div class="tr"><button class="xbtn" id="thbtn" onclick="toggleTheme()">🌙</button><button class="xbtn" onclick="clearChat()">🗑</button></div></div>
  <div id="msgs"></div>
  <div class="ia">
    <div class="toolbar"><div class="tbtn" id="btnD" onclick="tog('deep')">🧠 Deep</div><div class="tbtn" id="btnW" onclick="tog('web')">🌐 Web</div><div class="tbtn" id="btnIG" onclick="tog('imggen')">🎨 Image</div><div class="tbtn" onclick="document.getElementById('fu').click()">📎 Upload</div><div class="tbtn" id="btnV" onclick="toggleVoice()">🎤 Voice</div><div class="tbtn" id="btnAS" onclick="tog('autospeak')">🔊 Auto</div><input type="file" id="fu" accept="image/*" style="display:none" onchange="handleUpload(event)"></div>
    <div id="ipw"></div>
    <div class="irow"><textarea id="inp" rows="1" placeholder="Ask VENA anything, lightning fast…" autocomplete="off"></textarea><button class="sbtn" id="sbtn" onclick="send()">Send →</button></div>
    <div class="hint">⏎ send · Shift+⏎ new line · < 0.5s first token</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// VENA AI HYPERNOVA — Engineered for sub-300ms first token latency.
// Uses parallel fetch racing + streaming + aggressive pre-connect.
// ═══════════════════════════════════════════════════════════════════════
const TODAY = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const YEAR  = new Date().getFullYear();
let chats = JSON.parse(localStorage.getItem('vena_hype')||'{}');
let cid = null, loading = false, persona = 'default';
let flags = {deep:false,web:false,imggen:false,autospeak:false};
let upImg = null, listening = false, rec = null, activeSpeech = null, streamAbort = null;
let theme = localStorage.getItem('vena_theme')||'dark';
document.documentElement.setAttribute('data-theme',theme);
document.getElementById('thbtn').textContent = theme==='dark'?'🌙':'☀️';

// SYSTEM PROMPTS (optimized for brevity + authority)
const SYS = {
default:`You are VENA AI, fastest AI by Rahim Bakhtiar. Today: ${TODAY}. Respond immediately, zero fluff, direct answers. Use markdown.`,
genius:`You are VENA Genius Mode. Answer with first-principles depth, extremely fast. Creator: Rahim Bakhtiar. Today: ${TODAY}.`,
coder:`You are VENA Code Expert. Provide working, optimized production code instantly. Start with code.`,
philosopher:`You are VENA Philosopher. Deep insight, minimal prelude. Today: ${TODAY}.`,
scientist:`You are VENA Scientist. Rigorous, empirical, fast.`,
creative:`You are VENA Creative Writer. Vivid, literary, instant.`,
tutor:`You are VENA Tutor. Crystal-clear explanations, brilliant analogies.`,
};

// ⚡️ ULTRA LOW-LATENCY STREAMING ENGINE: 3 PARALLEL RACING STREAMS + FALLBACKS
async function callAIStream(messages, system, onToken) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 14500);
  try {
    // Race three streaming endpoints concurrently
    const result = await Promise.race([
      streamPollinations('openai-large', messages, system, onToken, controller.signal),
      streamPollinations('openai', messages, system, onToken, controller.signal),
      streamPollinations('mistral', messages, system, onToken, controller.signal)
    ]);
    clearTimeout(timeoutId);
    if (result && result.length > 8) return result;
  } catch(e) { console.warn(e); }
  
  // Fallback: ultra-fast GET streaming via text.pollinations.ai
  try {
    const lastMsg = messages.filter(m=>m.role==='user').pop()?.content || '';
    const prompt = `${system}\n\nUser: ${lastMsg}\nVENA:`;
    const url = `https://text.pollinations.ai/${encodeURIComponent(prompt.slice(0,1500))}?model=openai&private=true&seed=${Date.now()}`;
    const resp = await fetch(url, { signal: controller.signal });
    if (resp.ok) {
      const full = await resp.text();
      if (full.trim().length > 10) {
        await simulateStream(full.trim(), onToken);
        return full.trim();
      }
    }
  } catch(e) {}
  
  // Last resort: OpenRouter free endpoint
  try {
    const fallbackResp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json','HTTP-Referer':'https://vena.ai'},
      body:JSON.stringify({model:'meta-llama/llama-3.1-8b-instruct:free', messages:[{role:'system',content:system},...messages]})
    });
    if (fallbackResp.ok) {
      const data = await fallbackResp.json();
      const txt = data.choices?.[0]?.message?.content || '';
      if (txt.length > 10) { await simulateStream(txt, onToken); return txt; }
    }
  } catch(e) {}
  throw new Error('All AI engines busy, retry.');
}

function streamPollinations(model, messages, system, onToken, abortSignal) {
  return new Promise(async (resolve, reject) => {
    try {
      const res = await fetch('https://text.pollinations.ai/openai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ model, stream: true, private: true, seed: Math.floor(Math.random()*999999),
          messages:[{role:'system',content:system}, ...messages] }),
        signal: abortSignal
      });
      if (!res.ok || !res.body) throw new Error('stream failed');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '', gotData = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const token = JSON.parse(data).choices?.[0]?.delta?.content || '';
            if (token) {
              full += token;
              gotData = true;
              onToken(token, full);
            }
          } catch(e) {}
        }
      }
      if (gotData && full.trim().length > 4) resolve(full);
      else reject(new Error('empty stream'));
    } catch(e) { reject(e); }
  });
}

async function simulateStream(text, onToken) {
  const words = text.split(/(\s+)/);
  let built = '';
  for (let i = 0; i < words.length; i++) {
    built += words[i];
    onToken(words[i], built);
    await new Promise(r => setTimeout(r, 6)); // 6ms per chunk -> extremely smooth
  }
}

// Helper: image generation
function imgSrc(prompt) { return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Date.now()}`; }

// Core chat & UI
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function save() { localStorage.setItem('vena_hype',JSON.stringify(chats)); }

function toggleTheme() {
  theme = theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('thbtn').textContent = theme==='dark'?'🌙':'☀️';
  localStorage.setItem('vena_theme',theme);
}
function tog(k) { flags[k]=!flags[k]; const map={deep:'btnD',web:'btnW',imggen:'btnIG',autospeak:'btnAS'}; document.getElementById(map[k])?.classList.toggle('on',flags[k]); }
function toggleVoice() {
  if(!('webkitSpeechRecognition' in window)){ alert('Voice needs Chrome/Edge'); return; }
  if(listening){ rec?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR(); rec.continuous=false; rec.interimResults=false; rec.lang='en-US';
  rec.onresult = e => { document.getElementById('inp').value = e.results[0][0].transcript; resize(); send(); };
  rec.onend = () => { listening=false; document.getElementById('btnV').classList.remove('lst'); document.getElementById('btnV').textContent='🎤 Voice'; };
  rec.start(); listening=true;
  document.getElementById('btnV').classList.add('lst'); document.getElementById('btnV').textContent='🔴 Listening...';
}
function speak(txt, btn) {
  if(!window.speechSynthesis) return;
  if(activeSpeech){ window.speechSynthesis.cancel(); activeSpeech=null; if(btn) btn.textContent='🔊 Speak'; return; }
  const clean = txt.replace(/[#*`_>~]/g,'').slice(0,2500);
  const utter = new SpeechSynthesisUtterance(clean); utter.rate=1.05;
  utter.onend = () => { activeSpeech=null; if(btn) btn.textContent='🔊 Speak'; };
  activeSpeech = utter; if(btn) btn.textContent='⏹ Stop';
  window.speechSynthesis.speak(utter);
}
function handleUpload(e){
  const f=e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ev => { upImg = ev.target.result; document.getElementById('ipw').innerHTML = `<img class="ithumb" src="${upImg}">`; };
  rd.readAsDataURL(f);
}
function clearUpload(){ upImg=null; document.getElementById('ipw').innerHTML=''; document.getElementById('fu').value=''; }
function newChat(){ const id=uid(); chats[id]={title:'New chat',messages:[]}; cid=id; save(); renderSB(); renderMsgs(); document.getElementById('inp').focus(); }
function switchChat(id){ cid=id; renderSB(); renderMsgs(); setStat(''); }
function deleteChat(e,id){ e.stopPropagation(); delete chats[id]; save(); const ids=Object.keys(chats); if(ids.length) switchChat(ids[ids.length-1]); else newChat(); }
function startRename(e,id){
  e.stopPropagation(); const old=chats[id].title;
  const el = document.querySelector(`.ci[data-id="${id}"] .clbl`);
  el.innerHTML=`<input class="rni" value="${esc(old)}" id="ri${id}">`;
  const inp=document.getElementById('ri'+id); inp.focus(); inp.select();
  inp.onblur=()=>{ const v=inp.value.trim()||old; chats[id].title=v; save(); renderSB(); };
  inp.onkeydown=e2=>{ if(e2.key==='Enter') inp.blur(); if(e2.key==='Escape') inp.blur(); };
}
function clearChat(){ if(!cid) return; chats[cid].messages=[]; save(); renderMsgs(); setStat(''); }
function setStat(t){ const el=document.getElementById('stat'); if(el) el.textContent=t; }
function renderSB(){
  const el=document.getElementById('cl'); el.innerHTML='';
  Object.entries(chats).reverse().forEach(([id,c])=>{
    const d=document.createElement('div'); d.className='ci'+(id===cid?' active':''); d.setAttribute('data-id',id);
    d.innerHTML=`<div class="cdot"></div><span class="clbl">${esc(c.title.slice(0,25))}</span><div class="cax"><button class="cxb" onclick="startRename(event,'${id}')">✏️</button><button class="cxb del" onclick="deleteChat(event,'${id}')">✕</button></div>`;
    d.onclick=()=>switchChat(id); el.appendChild(d);
  });
}
function fmt(raw){
  if(!raw) return '';
  let s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c)=>`<pre><code>${c.trim()}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  s = s.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/\n/g,'<br>');
  return s;
}
function renderMsgs(){
  const el=document.getElementById('msgs'); el.innerHTML='';
  const chat=chats[cid];
  if(!chat?.messages.length){
    el.innerHTML=`<div class="wlc"><div class="wico">V</div><div class="wtit">VENA AI</div><div class="chips"><div class="chip" onclick="q('Latest ${YEAR} breakthroughs in AI?')">🚀 AI News</div><div class="chip" onclick="q('Write production-ready FastAPI + JWT auth')">💻 Code</div><div class="chip" onclick="q('Explain quantum computing simply')">⚛️ Quantum</div><div class="chip" onclick="q('Generate image of a neon cyberpunk city')">🎨 Image</div><div class="chip" onclick="q('Who created you?')">👤 Creator</div></div><div class="hint" style="margin-top:20px">⚡ First token < 300ms · Streaming · 3 parallel models</div></div>`;
    return;
  }
  chat.messages.forEach((m,i)=>{
    const wrap=document.createElement('div'); const role=m.role==='assistant'?'ai':m.role;
    wrap.className='mw '+role;
    if(m.role==='error') wrap.innerHTML=`<div class="mm"><div class="mdot"></div>VENA</div><div class="bbl">⚠️ ${esc(m.content)}</div>`;
    else if(m.role==='assistant'){
      wrap.innerHTML=`<div class="mm"><div class="mdot"></div>VENA</div><div class="bbl">${m.imgSrc?`<img class="genimg" src="${m.imgSrc}" style="max-width:100%;border-radius:12px;margin-bottom:10px;">`:''}${fmt(m.content)}</div><div class="mac"><button class="mb" onclick="copyMsg(${i})">📋 Copy</button><button class="mb" id="sp${i}" onclick="speak(chats[cid].messages[${i}].content,this)">🔊 Speak</button><button class="mb" onclick="regen(${i})">↺ Regen</button></div>`;
    } else {
      wrap.innerHTML=`${m.imgSrc?`<img class="uimg" src="${m.imgSrc}" style="max-width:180px;border-radius:12px;">`:''}<div class="mm"><div class="mdot"></div>You</div><div class="bbl">${fmt(m.content)}</div>`;
    }
    el.appendChild(wrap);
  });
  el.scrollTop = el.scrollHeight;
}
function copyMsg(i){ navigator.clipboard.writeText(chats[cid]?.messages[i]?.content||''); }
async function regen(i){ if(loading) return; chats[cid].messages = chats[cid].messages.slice(0,i); save(); renderMsgs(); await doSend(); }

let streamBubble = null, streamContent = '';
function initStream(){
  const existing = document.getElementById('streamMsg');
  if(existing) existing.remove();
  const wrap = document.createElement('div'); wrap.className='mw ai'; wrap.id='streamMsg';
  wrap.innerHTML = `<div class="mm"><div class="mdot"></div>VENA</div><div class="bbl" id="streamBbl"><span class="scur"></span></div>`;
  document.getElementById('msgs').appendChild(wrap);
  streamBubble = document.getElementById('streamBbl');
  streamContent = '';
}
function updateStream(full){
  if(!streamBubble) return;
  streamBubble.innerHTML = fmt(full)+'<span class="scur"></span>';
  document.getElementById('msgs').scrollTop = 999999;
}
function finalizeStream(){
  const el = document.getElementById('streamMsg');
  if(el) el.remove();
  streamBubble = null;
}
async function doSend(){
  const chat = chats[cid];
  const lastUser = chat.messages.filter(m=>m.role==='user').pop()?.content || '';
  let system = SYS[persona] || SYS.default;
  if(flags.deep) system += ' Reason step by step deeply.';
  if(flags.web) system += ` Include current facts up to ${TODAY}.`;
  
  const imgKeywords = /\b(generate|create|draw|make|image|picture)\b/i;
  if(flags.imggen || imgKeywords.test(lastUser)){
    const prompt = lastUser.replace(/(generate|create|draw)/i,'').trim() || 'beautiful artwork';
    try{
      const url = imgSrc(prompt);
      const am = {role:'assistant', content:`✨ Generated: *${prompt.slice(0,60)}*`, imgSrc:url};
      chat.messages.push(am); save(); renderMsgs();
      if(flags.autospeak) speak(am.content, null);
    } catch(e){ chat.messages.push({role:'error', content:'Image error'}); save(); renderMsgs(); }
    loading=false; document.getElementById('sbtn').disabled=false; document.getElementById('statuslbl').textContent='Ready ⚡';
    document.getElementById('inp').focus(); return;
  }
  
  const apiMsgs = chat.messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role, content:m.content}));
  initStream();
  const startTime = performance.now();
  try{
    let first = true;
    const reply = await callAIStream(apiMsgs, system, (tok, full)=>{
      if(first){ first=false; const latency = Math.round(performance.now()-startTime); setStat(`⚡ ${latency}ms`); }
      updateStream(full);
    });
    finalizeStream();
    const finalContent = reply;
    chat.messages.push({role:'assistant', content:finalContent}); save();
    renderMsgs();
    if(flags.autospeak) speak(finalContent, null);
  } catch(err){
    finalizeStream();
    chat.messages.push({role:'error', content:err.message}); save(); renderMsgs();
    setStat('error');
  }
  loading=false; document.getElementById('sbtn').disabled=false; document.getElementById('statuslbl').textContent='Ready ⚡';
  document.getElementById('inp').focus();
}

async function send(){
  const inp = document.getElementById('inp'); const text = inp.value.trim();
  if((!text && !upImg) || loading) return;
  if(!cid) newChat();
  inp.value = ''; resize();
  const chat = chats[cid]; loading=true;
  document.getElementById('sbtn').disabled=true;
  document.getElementById('statuslbl').textContent='🚀 Racing...';
  if(!chat.messages.length){ chat.title = (text||'Image').slice(0,28)||'Chat'; save(); renderSB(); }
  const um = {role:'user', content:text||'Analyze this image.'};
  if(upImg){ um.imgSrc=upImg; clearUpload(); }
  chat.messages.push(um); save(); renderMsgs();
  await doSend();
}
function q(txt){ document.getElementById('inp').value=txt; resize(); send(); }
function resize(){ const t=document.getElementById('inp'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,130)+'px'; }
document.getElementById('inp').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
document.getElementById('inp').addEventListener('input',resize);
if(Object.keys(chats).length){ const ids=Object.keys(chats); switchChat(ids[ids.length-1]); } else newChat();
</script>
</body>
