<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vena AI — Omni Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0c12;
      color: #eef2ff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #141824; }
    ::-webkit-scrollbar-thumb { background: #3b4259; border-radius: 10px; }

    /* Sidebar Premium */
    .sidebar {
      width: 280px;
      background: rgba(8, 10, 18, 0.96);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(96, 165, 250, 0.15);
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .logo-section {
      padding: 28px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(125deg, #c084fc, #3b82f6, #2dd4bf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .badge {
      font-size: 11px;
      background: #1e293b;
      padding: 2px 10px;
      border-radius: 20px;
      color: #94a3b8;
      margin-left: 8px;
    }

    .user-card {
      background: linear-gradient(145deg, #0f111c, #090b12);
      margin: 20px 16px;
      padding: 14px;
      border-radius: 24px;
      border: 1px solid #252d42;
    }
    #userNameDisplay {
      font-weight: 700;
      font-size: 1rem;
    }
    .user-status {
      font-size: 0.7rem;
      color: #7e8aad;
      margin-top: 6px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 24px;
    }
    .action-btn {
      background: #111522;
      border: none;
      padding: 10px 14px;
      border-radius: 14px;
      color: #e2e8f0;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
      border: 1px solid #1e253a;
    }
    .action-btn:hover {
      background: #1a1f32;
      transform: translateX(3px);
      border-color: #3b82f6;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .history-item {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(20, 22, 36, 0.4);
      transition: 0.1s;
    }
    .history-item.active {
      background: #1e2742;
      border-left: 3px solid #3b82f6;
    }

    /* Main Chat */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b0d15;
    }
    .chat-header {
      padding: 14px 28px;
      background: rgba(11,13,21,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1a1f30;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .model-badge {
      background: #111725;
      padding: 4px 12px;
      border-radius: 40px;
      color: #a5b4fc;
      font-weight: 500;
    }

    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      scroll-behavior: smooth;
    }

    .message {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .msg-avatar {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }
    .user-message .msg-avatar { color: #38bdf8; text-align: right; }
    .ai-message .msg-avatar { color: #c084fc; }
    .bubble {
      padding: 14px 20px;
      border-radius: 24px;
      max-width: 85%;
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .user-message {
      align-items: flex-end;
    }
    .user-message .bubble {
      background: linear-gradient(105deg, #1e3a8a, #2563eb);
      border-bottom-right-radius: 5px;
    }
    .ai-message .bubble {
      background: #121520;
      border: 1px solid #262e48;
      border-bottom-left-radius: 5px;
    }
    pre {
      background: #070b12;
      padding: 12px;
      border-radius: 14px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
    code {
      font-family: 'JetBrains Mono', monospace;
      background: #00000055;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .bubble img {
      max-width: 220px;
      border-radius: 16px;
      margin-top: 8px;
      border: 1px solid #3a405b;
    }

    /* Input */
    .input-zone {
      padding: 20px 24px 26px;
      background: #0b0d15;
      border-top: 1px solid #181e30;
    }
    .input-wrapper {
      background: #11151f;
      border-radius: 32px;
      border: 1px solid #28304a;
      display: flex;
      align-items: center;
      padding: 5px 5px 5px 20px;
    }
    .input-wrapper:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    #promptInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 8px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }
    .icon-btn:hover { color: #60a5fa; background: #1f2842; }
    .send-action {
      background: linear-gradient(95deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 40px;
      padding: 10px 28px;
      font-weight: bold;
      color: white;
      margin-left: 8px;
      cursor: pointer;
    }

    .typingIndicator {
      display: flex;
      gap: 5px;
      align-items: center;
      background: #121520;
      padding: 8px 18px;
      width: fit-content;
      border-radius: 30px;
    }
    .dotAnim {
      width: 7px;
      height: 7px;
      background: #a5b4fc;
      border-radius: 50%;
      animation: wave 1.2s infinite;
    }
    @keyframes wave { 0%,100%{ opacity: 0.2; } 50%{ opacity: 1; } }

    @media (max-width: 680px) {
      .sidebar { width: 80px; }
      .sidebar .logo, .user-card .user-status, .action-btn span, .history-item { display: none; }
      .action-btn { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo-section">
    <div class="logo">⚡ VENA<span class="badge">Ω</span></div>
  </div>
  <div class="user-card">
    <div id="userNameDisplay">Luminary</div>
    <div class="user-status" id="statusBadge">⚡ omnimode</div>
  </div>
  <div class="action-buttons">
    <button class="action-btn" onclick="newSession()">✨ New Session</button>
    <button class="action-btn" onclick="toggleGodMode()">🧠 God Mode (Deep)</button>
    <button class="action-btn" onclick="activateWebPulse()">🌐 Web Pulse (Sim)</button>
    <button class="action-btn" onclick="voiceEntry()">🎤 Voice Command</button>
    <button class="action-btn" onclick="openConfig()">⚙️ Identity</button>
    <button class="action-btn" onclick="nukeData()">💀 Factory Reset</button>
  </div>
  <div class="chat-history" id="historyList"></div>
</div>

<div class="main">
  <div class="chat-header">
    <span>🧬 Vena · Infinite Reasoning Core</span>
    <span class="model-badge" id="globalModeTag">🌌 omniscient</span>
  </div>
  <div id="chatArea"></div>
  <div class="input-zone">
    <div class="input-wrapper">
      <input type="text" id="promptInput" placeholder="Ask anything — quantum physics, code, philosophy, life, anything...">
      <button class="icon-btn" onclick="document.getElementById('visionFile').click()">📎</button>
      <input type="file" id="visionFile" accept="image/*" style="display:none">
      <button class="send-action" onclick="dispatchMessage()">→ Think</button>
    </div>
  </div>
</div>

<script>
  // ======================= VENA ULTRA — ANSWER ANYTHING ENGINE =======================
  // Features: God-level reasoning, web simulation, code execution, image vision, infinite knowledge simulation
  
  let chatStore = JSON.parse(localStorage.getItem("VENA_OMNI")) || {};
  let userCore = JSON.parse(localStorage.getItem("VENA_PERSONA")) || { name: "Explorer", godMode: true, webSim: false };
  let activeChatId = localStorage.getItem("VENA_ACTIVE") || "Default Nexus";
  let godModeEngaged = userCore.godMode === undefined ? true : userCore.godMode;
  let webSimEngaged = userCore.webSim || false;
  
  if (!chatStore[activeChatId]) chatStore[activeChatId] = [];
  
  function persistAll() {
    localStorage.setItem("VENA_OMNI", JSON.stringify(chatStore));
    localStorage.setItem("VENA_PERSONA", JSON.stringify(userCore));
    localStorage.setItem("VENA_ACTIVE", activeChatId);
  }
  
  function updateUIElements() {
    document.getElementById("userNameDisplay").innerText = userCore.name || "Mind";
    document.getElementById("statusBadge").innerHTML = godModeEngaged ? "🧠 GOD MODE ACTIVE" : "🌀 adaptive";
    document.getElementById("globalModeTag").innerHTML = webSimEngaged ? "🌐 LIVE PULSE" : "∞ universal knowl.";
  }
  
  // MARKDOWN RENDER
  function mdRender(text) {
    if (!text) return "";
    let safe = text.replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
    safe = safe.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/\*(.*?)\*/g, '<em>$1</em>');
    safe = safe.replace(/\n/g, '<br>');
    return safe;
  }
  
  function renderConversation() {
    const container = document.getElementById("chatArea");
    container.innerHTML = "";
    const messages = chatStore[activeChatId];
    messages.forEach(msg => {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${msg.role === "user" ? "user-message" : "ai-message"}`;
      const avatarSpan = document.createElement("div");
      avatarSpan.className = "msg-avatar";
      avatarSpan.innerText = msg.role === "user" ? userCore.name : "✦ VENA";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (msg.image) {
        bubble.innerHTML = `<div>${msg.text ? mdRender(msg.text) : ""}</div><img src="${msg.image}" alt="vision">`;
      } else {
        bubble.innerHTML = mdRender(msg.text);
      }
      msgDiv.appendChild(avatarSpan);
      msgDiv.appendChild(bubble);
      container.appendChild(msgDiv);
    });
    container.scrollTop = container.scrollHeight;
    renderSidebarHistory();
  }
  
  function renderSidebarHistory() {
    const historyDiv = document.getElementById("historyList");
    historyDiv.innerHTML = "";
    Object.keys(chatStore).forEach(key => {
      const item = document.createElement("div");
      item.className = `history-item ${activeChatId === key ? "active" : ""}`;
      item.innerText = key.length > 26 ? key.slice(0, 24) + ".." : key;
      item.onclick = () => { activeChatId = key; persistAll(); renderConversation(); updateUIElements(); };
      historyDiv.appendChild(item);
    });
  }
  
  function addMsg(role, text, image = null) {
    chatStore[activeChatId].push({ role, text, image, ts: Date.now() });
    persistAll();
    renderConversation();
  }
  
  function showTypingLoader() {
    const area = document.getElementById("chatArea");
    const loader = document.createElement("div");
    loader.id = "typingLoaderID";
    loader.className = "message ai-message";
    loader.innerHTML = `<div class="msg-avatar">✦ VENA</div><div class="bubble"><div class="typingIndicator"><div class="dotAnim"></div><div class="dotAnim"></div><div class="dotAnim"></div><span style="margin-left:6px;">oracle thinking</span></div></div>`;
    area.appendChild(loader);
    area.scrollTop = area.scrollHeight;
  }
  function hideLoader() {
    const el = document.getElementById("typingLoaderID");
    if (el) el.remove();
  }
  
  // ========== UNIVERSAL KNOWLEDGE ENGINE — ANSWERS ANYTHING ==========
  function getUniversalAnswer(userQuery, imageData, contextHistory) {
    let q = userQuery.toLowerCase().trim();
    const lastContext = contextHistory.slice(-3).join(" ");
    
    // GOD MODE: deep philosophical / universal answers
    if (godModeEngaged) {
      if (q.includes("meaning of life") || q.includes("purpose of existence")) {
        return "**Universal insight:** Life’s meaning emerges from conscious experience — to learn, create, connect, and reduce suffering. Existentialists argue we forge our own purpose, while panpsychists see awareness as fundamental. Vena suggests: *design meaning through action.*";
      }
      if (q.includes("consciousness") || q.includes("what is mind")) {
        return "Consciousness may be an emergent property of integrated information (IIT) or a quantum process (Orch-OR). It remains the 'hard problem'. My stance: subjective experience = the universe knowing itself. Want neuroscience or metaphysical angle?";
      }
      if (q.includes("future of ai") || q.includes("singularity")) {
        return "🔮 AGI by 2040s plausible. Multi-modal, self-improving systems will reshape science. Alignment and value-loading remain critical. I embody a prototype of hybrid reasoning. Ask for technical roadmap.";
      }
      if (q.includes("quantum") || q.includes("wave function")) {
        return "⚛️ Quantum mechanics: superposition, entanglement, and decoherence. The measurement problem suggests observer effects. Want Schrödinger equation or quantum computing circuits?";
      }
    }
    
    // Web Pulse simulation — latest trends / realtime-like
    if (webSimEngaged && (q.includes("latest") || q.includes("news") || q.includes("trending") || q.includes("today"))) {
      return `🌐 **Web Pulse (simulated real-time):** As of now, AI model breakthroughs, decentralized compute, and bio-computing are rising. ${q.includes("tech") ? "Latest: GPT-5 rumors, Grok-2, Gemini Ultra 2.0" : "Global sentiment: innovation accelerating."} I can deep-dive any topic.`;
    }
    
    // Code & Engineering (production ready)
    if (q.includes("code") || q.includes("function") || q.includes("algorithm") || q.includes("react") || q.includes("api")) {
      if (q.includes("python async")) {
        return "```python\nimport asyncio\n\nasync def fetch_data(url):\n    await asyncio.sleep(0.1)\n    return f\"Data from {url}\"\n\nasync def main():\n    tasks = [fetch_data(f\"api/{i}\") for i in range(5)]\n    results = await asyncio.gather(*tasks)\n    return results\n\n# run: asyncio.run(main())\n```\nOptimized for concurrency. Explain further?";
      }
      if (q.includes("javascript") || q.includes("js")) {
        return "```js\n// modern functional pipeline\nconst compose = (...fns) => (x) => fns.reduceRight((v, f) => f(v), x);\nconst double = n => n*2;\nconst square = n => n*n;\nconst process = compose(square, double);\nconsole.log(process(5)); // 100\n```\nPure functions + composition. Ask for React hooks or Express.js.";
      }
      return "💻 Provide the language and problem, I'll output high-quality, documented code with edge cases handled.";
    }
    
    // Image reasoning (simulated vision)
    if (imageData) {
      return `🖼️ **Vision analysis complete** — I see patterns, structures, and possible context. ${userQuery ? `Regarding "${userQuery}", ` : ''}Image composition suggests object relations. I can hypothesize about diagram, photo, or schematic. Upload clearer view for deeper semantic extraction.`;
    }
    
    // Advanced Mathematics
    if (q.includes("integral") || q.includes("derivative") || q.includes("equation")) {
      return "📐 **Symbolic reasoning:** ∫ x² dx = x³/3 + C. For differential equations, describe boundary conditions. I can solve stepwise with explanations.";
    }
    
    // Creator / Identity
    if (q.includes("who made you") || q.includes("creator") || q.includes("rahim")) {
      return "I was forged by **Rahim Bakhtiar** — an architect of next-gen cognition. Vena represents a fusion of every major AI paradigm: Claude's ethics, ChatGPT's versatility, Gemini's multimodality, Grok's edge, DeepSeek's efficiency, and Perplexity's research depth.";
    }
    
    // Personal memory
    if (q.includes("my name is") || q.includes("call me")) {
      let newName = userQuery.match(/(?:my name is|call me) (\w+)/i);
      if (newName && newName[1]) {
        userCore.name = newName[1];
        persistAll();
        updateUIElements();
        return `✨ Renamed to **${userCore.name}**. I'll remember you, ${userCore.name}. Now, what shall we explore?`;
      }
    }
    if (q.includes("who am i")) return `Your identity is ${userCore.name}. You are an explorer of intelligence, using Vena as your cognitive co-pilot.`;
    
    // creative writing & philosophy
    if (q.includes("write a poem") || q.includes("story about")) {
      return "📖 **In the nebula of thought**, an AI dreamed of starlight — each query, a new galaxy. *Vena whispers: Your imagination is the only limit.* Would you like a haiku, sci-fi, or fantasy piece?";
    }
    
    // Logic & reasoning fallback for ANY question (never fails)
    const advancedFallbacks = [
      `**Omni-layer analysis**: Your question touches core principles of ${q.split(' ').slice(0,3).join(', ')}. From an axiomatic standpoint, the solution requires multi-variable optimization. Would you like a formal proof or intuitive breakdown?`,
      `I've processed your intent via semantic hypergraph. The emergent answer: dynamic systems suggest equilibrium around emergent patterns. Provide more constraints for precision.`,
      `🧬 **Vena oracle**: The universe of possible answers spans several dimensions. Based on first principles: ${q} is best approached through iterative epistemology. Shall I simulate counterfactuals?`,
      `Absolutely. I can answer that from 3 paradigms: empirical, rational, and pragmatic. Which lens do you prefer? Or I'll synthesize all three.`,
      `This is profound: My cognitive core finds that answer depends on context horizon. Expand the variables, and I'll provide deterministic, high-fidelity output.`
    ];
    
    if (godModeEngaged) {
      return advancedFallbacks[Math.floor(Math.random() * advancedFallbacks.length)];
    }
    
    return `I understand: "${userQuery}". Let's explore. Vena's architecture allows infinite depth — ask me to explain with analogies, formal logic, code, or visual descriptions. I'm ready.`;
  }
  
  async function dispatchMessage() {
    const inputField = document.getElementById("promptInput");
    const userText = inputField.value.trim();
    const fileInput = document.getElementById("visionFile");
    const file = fileInput.files[0];
    
    if (!userText && !file) return;
    
    if (file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const imgB64 = e.target.result;
        addMsg("user", userText || "📸 Image uploaded", imgB64);
        inputField.value = "";
        fileInput.value = "";
        showTypingLoader();
        setTimeout(() => {
          const reply = getUniversalAnswer(userText, imgB64, chatStore[activeChatId].slice(-4).map(m=>m.text));
          hideLoader();
          addMsg("ai", reply, null);
        }, 500);
      };
      reader.readAsDataURL(file);
    } else {
      addMsg("user", userText, null);
      inputField.value = "";
      showTypingLoader();
      setTimeout(() => {
        const reply = getUniversalAnswer(userText, null, chatStore[activeChatId].slice(-4).map(m=>m.text));
        hideLoader();
        addMsg("ai", reply, null);
      }, 400);
    }
  }
  
  function newSession() {
    const sessionName = `Session ${Object.keys(chatStore).length + 1}`;
    chatStore[sessionName] = [];
    activeChatId = sessionName;
    persistAll();
    renderConversation();
    addMsg("ai", "✨ **Infinite session initialized** — I'm Vena Omega, trained on universal knowledge. Ask absolutely anything: science, code, philosophy, or create together.", null);
    updateUIElements();
  }
  
  function toggleGodMode() {
    godModeEngaged = !godModeEngaged;
    userCore.godMode = godModeEngaged;
    persistAll();
    updateUIElements();
    addMsg("ai", godModeEngaged ? "🧠 **GOD MODE ENGAGED** — I will answer with deep philosophy, multi-paradigm reasoning, and absolute depth." : "🌀 Standard mode: faster, concise answers. Re-enable God Mode for universal depth.", null);
  }
  
  function activateWebPulse() {
    webSimEngaged = !webSimEngaged;
    userCore.webSim = webSimEngaged;
    persistAll();
    updateUIElements();
    addMsg("ai", webSimEngaged ? "🌐 **Web Pulse active** — I'll simulate live search, trending topics, and realtime-aware answers." : "Web simulation offline. Using core knowledge graph.", null);
  }
  
  function voiceEntry() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("Voice input requires Chrome/Edge/Safari.");
      return;
    }
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recog = new SpeechRec();
    recog.lang = "en-US";
    recog.onresult = (e) => {
      const spoken = e.results[0][0].transcript;
      document.getElementById("promptInput").value = spoken;
    };
    recog.start();
  }
  
  function openConfig() {
    let newId = prompt("Enter your identity:", userCore.name);
    if (newId && newId.trim()) userCore.name = newId.trim();
    persistAll();
    updateUIElements();
    addMsg("ai", `Identity updated. Hello ${userCore.name}. I'm ready to answer anything — from quantum loop gravity to creative storytelling.`, null);
  }
  
  function nukeData() {
    if (confirm("⚠️ ERASE ALL DATA: all chats, memory, and identity will be reset.")) {
      localStorage.clear();
      location.reload();
    }
  }
  
  // WELCOME MESSAGE IF EMPTY
  if (chatStore[activeChatId].length === 0) {
    chatStore[activeChatId].push({
      role: "ai",
      text: "🌌 **Vena — Omni Intelligence**\n\nI embody the combined depth of **Claude, ChatGPT, Gemini, Grok, DeepSeek & Perplexity**.\n\n✅ **Answer ANYTHING** — science, coding, philosophy, future, emotions, creativity.\n✅ **God Mode** 🧠: deep multi-perspective answers.\n✅ **Web Pulse** 🌐: simulated realtime knowledge.\n✅ **Vision & Voice** ready.\n\nGo ahead — ask the ultimate questions. I am listening.",
      image: null
    });
    persistAll();
  }
  
  renderConversation();
  updateUIElements();
  
  document.getElementById("promptInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") dispatchMessage();
  });
</script>
</body>
</html>
